<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <title>VS Media — Speed Ramp</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="panel">

  <!-- Header -->
  <div class="header">
    <div class="logo">VS <span>MEDIA</span></div>
    <div class="subtitle">Speed Ramp Tool · After Effects</div>
  </div>

  <!-- Layer info -->
  <div class="layer-bar" id="layerBar">
    <div class="layer-dot" id="layerDot"></div>
    <div class="layer-name" id="layerName">Nenhum layer seleccionado</div>
    <button class="btn-refresh" id="btnRefresh" title="Actualizar">↺</button>
  </div>

  <!-- ── CONTROLOS ─────────────────────────────── -->
  <div class="section">
    <div class="section-title">VELOCIDADES</div>

    <div class="slider-row">
      <label>Slow</label>
      <input type="range" id="sliderSlow" min="5" max="50" value="20" step="1"/>
      <span id="valSlow">20%</span>
    </div>
    <div class="slider-row">
      <label>Fast</label>
      <input type="range" id="sliderFast" min="80" max="300" value="100" step="10"/>
      <span id="valFast">100%</span>
    </div>

    <div class="divider"></div>
    <div class="section-title">DURAÇÃO DO SLOW</div>

    <div class="slider-row">
      <label>Duração</label>
      <input type="range" id="sliderDur" min="2" max="40" value="10" step="1"/>
      <span id="valDur">1.0s</span>
    </div>

    <div class="divider"></div>
    <div class="section-title">BEZIER</div>

    <div class="slider-row">
      <label>Suavidade</label>
      <input type="range" id="sliderEase" min="10" max="90" value="50" step="5"/>
      <span id="valEase">50%</span>
    </div>
  </div>

  <!-- ── PONTOS MARCADOS ────────────────────────── -->
  <div class="section section-marks">
    <div class="marks-header">
      <div class="section-title">PONTOS SLOW</div>
      <button class="btn-clear" id="btnClearAll">Limpar</button>
    </div>

    <button class="btn-mark" id="btnMark">
      + Marcar tempo actual
    </button>

    <div class="marks-list" id="marksList">
      <div class="marks-empty" id="marksEmpty">
        Scruba para um ponto e clica em "Marcar"
      </div>
    </div>
  </div>

  <!-- ── APLICAR ────────────────────────────────── -->
  <div class="section">
    <button class="btn-apply" id="btnApply" disabled>
      APLICAR SPEED RAMPS
    </button>
    <div class="apply-hint" id="applyHint">
      Selecciona um layer e marca pelo menos 1 ponto.
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="statusBar">Pronto.</div>

</div>

<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
